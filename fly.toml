app = 'logistics-backend-6f0pea'
primary_region = 'lax'

[build]

[deploy]
  release_command = "sh -lc 'cd /app && PYTHONPATH=/app .venv/bin/alembic upgrade head'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
