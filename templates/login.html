<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login | Citywide Logistics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>

  <header class="site-header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-title">Citywide Logistics</div>
        <div class="brand-subtitle">Sign In</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="/">Planner</a>
      <a href="/signup">Create Account</a>
    </nav>
  </header>

  <main class="shell">
    <section class="dashboard">
      <div class="card">
        <div class="card-header">
          <div>
            <h2>Sign in</h2>
          </div>
        </div>
        {% if error %}
          <div class="empty-state">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" autocomplete="on">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" autocomplete="username" required />
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
          <div class="form-actions">
            <button class="btn btn-primary icon-only" type="submit" title="Sign in" aria-label="Sign in">
              <span class="btn-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14" />
                  <path d="M13 5l7 7-7 7" />
                </svg>
              </span>
              <span class="sr-only">Sign in</span>
            </button>
            <a class="btn btn-secondary icon-only" href="/signup" title="Create account" aria-label="Create account">
              <span class="btn-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 5v14" />
                  <path d="M5 12h14" />
                </svg>
              </span>
              <span class="sr-only">Create account</span>
            </a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>Citywide Logistics Planner</div>
    <div>Internal dispatch tools</div>
  </footer>
</body>
</html>
