<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Create Jobsite | Logistics Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>

  <header class="site-header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-title">Logistics Planner</div>
        <div class="brand-subtitle">Manager/Admin Console</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="/">Planner</a>
      <a href="/admin">Manager/Admin Home</a>
      <a href="/">Schedule</a>
      <a href="/logout">Logout</a>
    </nav>
  </header>

  <main class="shell">
    <section class="dashboard">
      <div class="card">
        <div class="card-header">
          <div>
            <h2>Create Jobsite</h2>
          </div>
          <div class="page-actions">
            <a class="btn btn-secondary icon-only" href="/admin" title="Back to Manager/Admin" aria-label="Back to Manager/Admin">
              <span class="btn-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M15 18l-6-6 6-6" />
                  <path d="M9 12h10" />
                </svg>
              </span>
              <span class="sr-only">Back to Manager/Admin</span>
            </a>
          </div>
        </div>
        <form method="post" action="/admin/jobsites/create" autocomplete="on">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          {% if error %}
            <div class="empty-state">{{ error }}</div>
          {% endif %}
          <label for="jobsiteName">Jobsite Name (Airtable field: "{{ name_field }}")</label>
          <input id="jobsiteName" name="name" placeholder="Site name" value="{{ name_value or '' }}" autocomplete="organization" required />

          <label for="jobsiteAddress">Jobsite Address (Airtable field: "{{ address_field }}")</label>
          <input id="jobsiteAddress" name="address" placeholder="Full site address" value="{{ address_value or '' }}" autocomplete="street-address" required />

          <div class="form-actions">
            <button class="btn btn-primary icon-only" type="submit" title="Create Jobsite" aria-label="Create Jobsite">
              <span class="btn-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 5v14" />
                  <path d="M5 12h14" />
                </svg>
              </span>
              <span class="sr-only">Create Jobsite</span>
            </button>
          </div>
          <div class="helper">After creation, the server geocodes and updates Latitude/Longitude.</div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>Logistics Planner</div>
    <div>Internal manager/admin tools</div>
  </footer>
</body>
</html>
