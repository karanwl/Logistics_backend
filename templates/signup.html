<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign Up | Citywide Logistics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>

  <header class="site-header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-title">Citywide Logistics</div>
        <div class="brand-subtitle">Request Access</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="/">Planner</a>
      <a href="/login">Sign In</a>
    </nav>
  </header>

  <main class="shell">
    <section class="dashboard">
      <div class="card">
        <div class="card-header">
          <div>
            <h2>Request access</h2>
          </div>
        </div>
        <div class="empty-state">
          {{ message or "Account creation is managed by your administrator. Please contact admin to request access." }}
        </div>
        <div class="form-actions">
          <a class="btn btn-secondary icon-only" href="/login" title="Sign in" aria-label="Sign in">
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14" />
                <path d="M13 5l7 7-7 7" />
              </svg>
            </span>
            <span class="sr-only">Sign in</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>Citywide Logistics Planner</div>
    <div>Internal dispatch tools</div>
  </footer>
</body>
</html>
